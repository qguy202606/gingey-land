  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Nunito", "Segoe UI", sans-serif;
      background: #fff8f0; color: #5c3d2e;
      min-height: 100vh;
      text-align: center;
      margin: 0;
    }
    main {
      max-width: 1080px;
      margin: 28px auto;
      padding: 0 18px;
      text-align: center;
    }
    .page-title {
      font-size: 2.2rem;
      font-weight: 900;
      text-align: center;
      margin-bottom: 8px;
      color: #a76a42;
    }
    .page-subtitle {
      text-align: center;
      font-size: 1.1rem;
      color: #7a5a48;
      margin-bottom: 28px;
    }
    .photo-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 18px;
      justify-items: center;
    }
    .photo-card {
      border-radius: 22px;
      overflow: hidden;
      background: #fff;
      box-shadow: 0 3px 14px rgba(92,61,46,0.15);
      width: 100%;
      max-width: 300px;
      text-align: center;
      cursor: pointer;
    }
    .photo-card svg {
      width: 100%;
      height: auto;
      display: block;
    }
    .caption {
      padding: 10px 14px;
      font-weight: 700;
      font-size: 0.95rem;
      color: #5c3d2e;
    }
  </style>
</head>
